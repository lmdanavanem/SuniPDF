[package]
name = "sunipdf-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "SuniPDF document engine: opening, inspection and page rendering with PDFium."

[dependencies]
pdfium-render = { workspace = true }
lopdf = { workspace = true }
stringprep = { workspace = true }
getrandom = "0.4"
image = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tempfile = "3"
zeroize = "1"
xml-rs = "0.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
image = { workspace = true }
