[workspace]
resolver = "2"
members = [
    "apps/sunipdf-desktop",
    "apps/sunipdf-cli",
    "crates/sunipdf-core",
    "crates/sunipdf-i18n",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.9.1"
rust-version = "1.85"
authors = ["Emanuel DE ALMEIDA <https://github.com/lmdanavanem>"]
repository = "https://github.com/lmdanavanem/SuniPDF"
homepage = "https://navanem.com/projets/sunipdf/"

[workspace.dependencies]
sunipdf-core = { path = "crates/sunipdf-core" }
sunipdf-i18n = { path = "crates/sunipdf-i18n" }
pdfium-render = "0.9.4"
lopdf = "0.45"
stringprep = "0.1"
# Backend glow (OpenGL) : le backend wgpu/DX12 ne compile pas (wgpu-hal 30.0.1 vs gpu-allocator 0.28), voir KNOWN_ISSUES.
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "glow", "links"] }
egui = "0.36"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
# Date locale du jour (« Insérer la date ») ; déjà dans l'arbre via lopdf et pdfium-render.
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "tiff", "webp"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
# Moins de mémoire et de disque par processus rustc (poste à 14 Go, cf. KNOWN_ISSUES).
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
