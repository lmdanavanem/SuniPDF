[workspace]
resolver = "2"
members = [
    "apps/sunipdf-desktop",
    "apps/sunipdf-cli",
    "crates/sunipdf-core",
    "crates/sunipdf-i18n",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.83.0"
rust-version = "1.95"
authors = ["Emanuel DE ALMEIDA <https://github.com/lmdanavanem>"]
repository = "https://github.com/lmdanavanem/SuniPDF"
homepage = "https://navanem.com/projets/sunipdf/"

[workspace.dependencies]
sunipdf-core = { path = "crates/sunipdf-core" }
sunipdf-i18n = { path = "crates/sunipdf-i18n" }
pdfium-render = "0.9.4"
# shortcut: fixes absent from registry 0.45.0; return to a registry release containing upstream fixes 573 and 586.
lopdf = { version = "0.45", git = "https://github.com/J-F-Liu/lopdf", rev = "6ce451328c5caa65d50462daaf4ee8db9c85bb8e" }
stringprep = "0.1"
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "glow", "wgpu", "links"] }
egui = "0.37"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
# Date locale du jour (« Insérer la date ») ; déjà dans l'arbre via lopdf et pdfium-render.
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "tiff", "webp"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
# Moins de mémoire et de disque par processus rustc (poste à 14 Go, cf. KNOWN_ISSUES).
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
