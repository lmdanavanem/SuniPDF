# CI Windows (cible de référence MSVC).
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Cache pinned offline OCR runtime
        uses: actions/cache@v6
        with:
          path: third_party/ocr/win-x64
          key: windows-ocr-x64-${{ hashFiles('scripts/fetch-ocr.ps1') }}
      - name: PDFium (x64)
        run: .\scripts\fetch-pdfium.ps1 -Arch x64
      - name: Offline OCR (x64, including English and French)
        run: .\scripts\fetch-ocr.ps1 -Arch x64
      - name: Translation catalog parity
        run: .\scripts\check-i18n.ps1
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -j 2 -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked -j 2
      - name: Pinned independent QPDF checker
        run: .\scripts\fetch-qpdf.ps1
      - name: QPDF archive checksum self-test
        run: .\scripts\fetch-qpdf.ps1 -SelfTest
      - name: Synthetic corpus and generated PDF structural checks
        run: cargo test -p sunipdf-cli --test qpdf_corpus --locked -j 2 -- --ignored --nocapture
      - name: Real corpus checksum self-test
        run: .\scripts\fetch-regression-corpus.ps1 -SelfTest
      - name: Pinned licensed real PDF corpus
        run: .\scripts\fetch-regression-corpus.ps1
      - name: Real PDFs and independent output regression
        run: cargo test -p sunipdf-cli --test real_corpus --locked -j 2 -- --ignored --nocapture
      - name: Pinned local Office converter on disposable runner
        run: .\scripts\fetch-test-libreoffice.ps1
      - name: Measured licensed Office exports and local converter profiles
        env:
          SUNIPDF_REQUIRE_OFFICE_CONVERTER: '1'
        run: |
          $env:SUNIPDF_OFFICE_REPORT = Join-Path (Get-Location).Path 'target/office-fidelity-report.json'
          cargo test -p sunipdf-core --test office_fidelity_corpus --locked -j 2 -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Office regression failed.' }
      - name: Office regression evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: office-regression-evidence
          path: |
            target/office-fidelity-report.json
            target/office-converter-provenance.json
          if-no-files-found: ignore
      - name: Real corpus regression evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: real-corpus-evidence
          path: target/regression-corpus-report.json
          if-no-files-found: ignore
      - name: Update helper checks
        run: .\apps\sunipdf-desktop\src\update-helper.ps1 -SelfTest
      - name: "Portable x64 package (including licenses and notices)"
        run: .\scripts\package-portable.ps1 -Arch x64
      - name: Test-only software OpenGL checksum self-test
        run: .\scripts\fetch-test-opengl.ps1 -SelfTest
      - name: Test-only software OpenGL for the isolated application
        run: .\scripts\fetch-test-opengl.ps1
      - name: Real isolated portable upgrades, rollback and close cancellation
        run: .\scripts\test-portable-update.ps1 -Package (Get-ChildItem dist\*-win-x64-portable.zip | Select-Object -First 1 -ExpandProperty FullName)
      - name: Portable update regression evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: portable-update-evidence
          path: target/portable-update-*.json
          if-no-files-found: ignore
      - name: MSI x64 package
        run: .\scripts\package-msi.ps1 -Arch x64
      - name: Real MSI installation and upgrade on disposable runner
        run: |
          $msi = Get-ChildItem dist\*.msi | Select-Object -First 1 -ExpandProperty FullName
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.8.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.9.1
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.10.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.11.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.12.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.13.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.14.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.15.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.16.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.17.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.18.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.19.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.20.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.21.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.21.1
      - name: MSI upgrade regression evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: msi-upgrade-evidence
          path: target/msi-upgrade-*/*.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: sunipdf-win-x64-portable
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*.msi
