# CI Windows (cible de référence MSVC).
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: PDFium (x64)
        run: .\scripts\fetch-pdfium.ps1 -Arch x64
      - name: Parité des catalogues i18n
        run: .\scripts\check-i18n.ps1
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: "Paquet portable x64 (même contenu que la release : licences et notices comprises)"
        run: .\scripts\package-portable.ps1 -Arch x64
      - uses: actions/upload-artifact@v4
        with:
          name: sunipdf-win-x64-portable
          path: |
            dist/*.zip
            dist/*.sha256
