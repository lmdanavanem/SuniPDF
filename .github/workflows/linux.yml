name: linux
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build Ubuntu 22.04 amd64
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libegl1-mesa-dev libudev-dev libdbus-1-dev libgtk-3-dev libvulkan-dev tesseract-ocr tesseract-ocr-eng tesseract-ocr-fra dpkg-dev desktop-file-utils lintian
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ubuntu22-amd64
          cache-on-failure: true
      - name: Fetch verified Linux PDFium
        run: python scripts/fetch-pdfium-linux.py
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -j 2 -- -D warnings
      - name: Workspace tests
        run: cargo test --workspace --locked -j 2 --no-fail-fast
      - name: Build Linux desktop and CLI
        run: cargo build --release --workspace --locked --target x86_64-unknown-linux-gnu -j 2
