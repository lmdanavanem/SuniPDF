# Release packages: Windows portable ZIPs and MSI, plus Ubuntu amd64 DEB and macOS arm64 DMG.
# Déclenchée par un tag v* ou à la main. Les tests tournent avant tout empaquetage (x64) ; l'ARM64 est
# compilé mais jamais exécuté sur du matériel ARM64 : il est publié comme tel.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    uses: ./.github/workflows/linux.yml
    permissions:
      contents: read

  macos:
    uses: ./.github/workflows/macos.yml
    permissions:
      contents: read

  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Historical package cache regression
        if: matrix.arch == 'x64'
        run: .\scripts\test-upgrade-baseline-cache.ps1
      - name: Restore verified historical Windows packages
        if: matrix.arch == 'x64' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        id: upgrade_baseline_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: target/upgrade-baseline-cache
          key: sunipdf-historical-windows-v1-trusted-${{ hashFiles('scripts/test-portable-update.ps1', 'scripts/test-msi-upgrade.ps1', 'scripts/upgrade-baseline-cache.ps1', 'scripts/prepare-upgrade-baselines.ps1') }}
          restore-keys: |
            sunipdf-historical-windows-v1-trusted-
      - name: Prepare verified historical package bytes
        if: matrix.arch == 'x64' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        id: prepare_upgrade_baselines
        run: .\scripts\prepare-upgrade-baselines.ps1
      # Populate the default-branch cache before long builds; migration gates still run below.
      - name: Save verified historical Windows packages
        if: matrix.arch == 'x64' && github.ref == 'refs/heads/main' && steps.prepare_upgrade_baselines.outcome == 'success' && steps.upgrade_baseline_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: target/upgrade-baseline-cache
          key: ${{ steps.upgrade_baseline_cache.outputs.cache-primary-key }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-pc-windows-msvc
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ${{ matrix.arch == 'x64' && 'windows' || '' }}
          key: ${{ matrix.arch == 'arm64' && 'arm64' || '' }}
          cache-on-failure: true
      - name: Cache pinned offline OCR runtime
        id: ocr_runtime
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: third_party/ocr/win-${{ matrix.arch }}
          key: windows-ocr-${{ matrix.arch }}-${{ hashFiles('scripts/fetch-ocr.ps1') }}
      - name: Offline OCR (${{ matrix.arch }}, including English and French)
        run: .\scripts\fetch-ocr.ps1 -Arch ${{ matrix.arch }}
      - name: Save verified OCR build before application checks
        if: steps.ocr_runtime.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: third_party/ocr/win-${{ matrix.arch }}
          key: windows-ocr-${{ matrix.arch }}-${{ hashFiles('scripts/fetch-ocr.ps1') }}
      - name: Format and Clippy (x64)
        if: matrix.arch == 'x64'
        run: |
          .\scripts\package-msi.ps1 -SelfTest
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Formatting check failed.' }
          cargo clippy --workspace --all-targets --locked --keep-going -j 2 -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Clippy failed.' }
      - name: Tests (x64)
        id: workspace_tests
        if: matrix.arch == 'x64'
        run: |
          .\scripts\fetch-pdfium.ps1 -Arch x64
          .\scripts\check-i18n.ps1
          python .\scripts\package-guides.py --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Packaged documentation link checks failed.' }
          cargo test --workspace --locked -j 2 --no-fail-fast 2>&1 | Tee-Object -FilePath target/workspace-tests.log
          if ($LASTEXITCODE -ne 0) { throw 'Workspace tests failed.' }
          .\apps\sunipdf-desktop\src\update-helper.ps1 -SelfTest
      - name: Bounded layout and register performance evidence (x64)
        if: matrix.arch == 'x64' && steps.workspace_tests.outcome == 'success'
        run: |
          python .\scripts\run-performance-evidence.py --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Performance evidence boundary tests failed.' }
          python .\scripts\run-performance-evidence.py
          if ($LASTEXITCODE -ne 0) { throw 'Performance evidence failed.' }
      - name: Performance measurement evidence (x64)
        if: always() && matrix.arch == 'x64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: performance-windows-x64
          path: target/performance-evidence/
          if-no-files-found: warn
      - name: Reader interface layout and DX12 software rendering (x64)
        if: always() && !cancelled() && matrix.arch == 'x64' && steps.workspace_tests.outcome == 'success'
        run: .\scripts\run-reader-ui-evidence.ps1
      - name: Reader interface evidence (x64)
        if: always() && matrix.arch == 'x64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: reader-ui-evidence
          path: target/reader-ui-evidence/
          if-no-files-found: warn
      - name: Pinned independent QPDF checker (x64)
        if: always() && !cancelled() && matrix.arch == 'x64' && steps.workspace_tests.outcome != 'skipped'
        run: .\scripts\fetch-qpdf.ps1
      - name: Independent feature-reader checker self-test (x64)
        if: always() && !cancelled() && matrix.arch == 'x64' && steps.workspace_tests.outcome != 'skipped'
        run: python .\scripts\test-feature-reader.py --self-test
      - name: Rich annotation and document structure independent readers (x64)
        if: always() && !cancelled() && matrix.arch == 'x64' && steps.workspace_tests.outcome != 'skipped'
        run: |
          .\scripts\fetch-test-mupdf.ps1
          python .\scripts\test-feature-reader.py
          if ($LASTEXITCODE -ne 0) { throw 'Independent feature reader regression failed.' }
      - name: Independent feature reader evidence (x64)
        if: always() && matrix.arch == 'x64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: feature-independent-reader-evidence
          path: |
            target/feature-independent-reader-report.json
            target/feature-030-evidence/
          if-no-files-found: ignore
      - name: Pinned independent font reader (x64)
        if: always() && !cancelled() && matrix.arch == 'x64' && steps.workspace_tests.outcome != 'skipped'
        run: |
          .\scripts\fetch-test-mupdf.ps1
          python .\scripts\test-font-reader.py --mutool target/test-mupdf/1.28.5/mutool.exe --directory target/font-embedding-evidence
          if ($LASTEXITCODE -ne 0) { throw 'Independent font reader regression failed.' }
      - name: Independent font reader evidence (x64)
        if: always() && matrix.arch == 'x64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: font-independent-reader-evidence
          path: |
            target/workspace-tests.log
            target/font-independent-reader-report.json
            target/font-embedding-evidence/
          if-no-files-found: ignore
      - name: Native DX12 software renderer and texture limits (x64)
        if: always() && !cancelled() && matrix.arch == 'x64' && steps.workspace_tests.outcome != 'skipped'
        run: .\scripts\run-built-ci-test.ps1 -TestName native_wgpu
      - name: Native renderer evidence (x64)
        if: always() && matrix.arch == 'x64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-wgpu-evidence
          path: target/native-wgpu-evidence/
          if-no-files-found: ignore
      - name: Synthetic corpus and generated PDF structural checks (x64)
        if: always() && !cancelled() && matrix.arch == 'x64' && steps.workspace_tests.outcome != 'skipped'
        run: .\scripts\run-built-ci-test.ps1 -TestName qpdf_corpus
      - name: Pinned licensed real PDF corpus (x64)
        if: always() && !cancelled() && matrix.arch == 'x64' && steps.workspace_tests.outcome != 'skipped'
        run: .\scripts\fetch-regression-corpus.ps1
      - name: Real PDFs and independent output regression (x64)
        if: always() && !cancelled() && matrix.arch == 'x64' && steps.workspace_tests.outcome != 'skipped'
        run: .\scripts\run-built-ci-test.ps1 -TestName real_corpus
      - name: Pinned PDF 2.0 interoperability corpus (x64)
        if: always() && !cancelled() && matrix.arch == 'x64' && steps.workspace_tests.outcome != 'skipped'
        run: |
          .\scripts\fetch-regression-corpus.ps1 -Interop -SelfTest
          .\scripts\fetch-regression-corpus.ps1 -Interop
      - name: PDF 2.0 text, pixels, annotations and immutable sources (x64)
        if: always() && !cancelled() && matrix.arch == 'x64' && steps.workspace_tests.outcome != 'skipped'
        run: .\scripts\run-built-ci-test.ps1 -TestName interop_corpus
      - name: Interoperability and bounded mutation evidence (x64)
        if: always() && matrix.arch == 'x64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: interoperability-and-mutation-evidence
          path: |
            target/interop-corpus-report.json
            target/adversarial-corpus-report.json
          if-no-files-found: error
      - name: Restore pinned Office MSI only (x64)
        id: office_installer_cache
        if: always() && !cancelled() && matrix.arch == 'x64' && steps.workspace_tests.outcome != 'skipped'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: target/test-office-installer/installer.msi
          key: windows-x64-office-msi-v1-${{ hashFiles('scripts/test-libreoffice.json', 'scripts/fetch-test-libreoffice.ps1') }}
      - name: Pinned local Office converter on disposable runner (x64)
        id: office_converter
        if: always() && !cancelled() && matrix.arch == 'x64' && steps.workspace_tests.outcome != 'skipped'
        run: |
          pwsh -NoProfile -File .\scripts\fetch-test-libreoffice.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Office converter setup self-test failed.' }
          pwsh -NoProfile -File .\scripts\fetch-test-libreoffice.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Office converter installation failed.' }
          $proof = Get-Content -Raw target/office-converter-provenance.json | ConvertFrom-Json
          if ($proof.source_revision -ne $env:GITHUB_SHA -or -not (Test-Path -LiteralPath $proof.installed_path)) { throw 'Installed Office converter provenance is missing or invalid.' }
      - name: Save verified pinned Office MSI only (x64)
        if: always() && !cancelled() && matrix.arch == 'x64' && steps.office_converter.outcome == 'success' && steps.office_installer_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: target/test-office-installer/installer.msi
          key: ${{ steps.office_installer_cache.outputs.cache-primary-key }}
      - name: Measured licensed Office exports and local converter profiles (x64)
        if: always() && !cancelled() && matrix.arch == 'x64' && steps.workspace_tests.outcome != 'skipped'
        env:
          SUNIPDF_REQUIRE_OFFICE_CONVERTER: '1'
        run: |
          $env:SUNIPDF_OFFICE_REPORT = Join-Path (Get-Location).Path 'target/office-fidelity-report.json'
          .\scripts\run-built-ci-test.ps1 -TestName office_fidelity_corpus
          if ($LASTEXITCODE -ne 0) { throw 'Office regression failed.' }
      - name: Office regression evidence (x64)
        if: always() && matrix.arch == 'x64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: office-regression-evidence
          path: |
            target/office-fidelity-report.json
            target/office-converter-provenance.json
          if-no-files-found: ignore
      - name: Real corpus regression evidence (x64)
        if: always() && matrix.arch == 'x64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: real-corpus-evidence
          path: target/regression-corpus-report.json
          if-no-files-found: ignore
      - name: Portable (${{ matrix.arch }})
        run: .\scripts\package-portable.ps1 -Arch ${{ matrix.arch }}
      - name: Packaged PDF inspection regression (x64)
        if: matrix.arch == 'x64'
        run: |
          $version = (Select-String -LiteralPath Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $cli = Join-Path (Get-Location) "dist/SuniPDF-$version-win-x64-portable/sunipdf-cli.exe"
          python .\scripts\test-pdf-inspection.py --cli $cli --report target\pdf-inspection-report.json
          if ($LASTEXITCODE -ne 0) { throw 'Packaged PDF inspection regression failed.' }
      - name: PDF inspection evidence (x64)
        if: always() && matrix.arch == 'x64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pdf-inspection-evidence
          path: target/pdf-inspection-report.json
          if-no-files-found: ignore
      - name: Packaged visual signature preparation regression (x64)
        if: matrix.arch == 'x64'
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r scripts/qa-image-requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Pinned test-only image reader installation failed.' }
          $version = (Select-String -LiteralPath Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $cli = Join-Path (Get-Location) "dist/SuniPDF-$version-win-x64-portable/sunipdf-cli.exe"
          python .\scripts\test-signature-preparation.py --cli $cli --report target\visual-signature-report.json
          if ($LASTEXITCODE -ne 0) { throw 'Packaged visual signature preparation failed.' }
      - name: Visual signature preparation evidence (x64)
        if: always() && matrix.arch == 'x64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: visual-signature-evidence
          path: target/visual-signature-report.json
          if-no-files-found: ignore
      - name: Packaged page decorations regression (x64)
        if: matrix.arch == 'x64'
        run: |
          $version = (Select-String -LiteralPath Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $cli = Join-Path (Get-Location) "dist/SuniPDF-$version-win-x64-portable/sunipdf-cli.exe"
          python .\scripts\test-page-decorations.py --cli $cli --report target\page-decorations-report.json
          if ($LASTEXITCODE -ne 0) { throw 'Packaged page decorations failed.' }
      - name: Page decorations evidence (x64)
        if: always() && matrix.arch == 'x64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: page-decoration-evidence
          path: target/page-decorations-report.json
          if-no-files-found: ignore
      - name: Packaged revision batch and independent PDF checks (x64)
        if: matrix.arch == 'x64'
        run: |
          $version = (Select-String -LiteralPath Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $cli = Join-Path (Get-Location) "dist/SuniPDF-$version-win-x64-portable/sunipdf-cli.exe"
          $qpdf = Join-Path (Get-Location) 'target/qpdf-12.4.2-msvc64/qpdf-12.4.2-msvc64/bin/qpdf.exe'
          python .\scripts\test-revision-transfer-batch.py --cli $cli --qpdf $qpdf --directory target\revision-batch-evidence
          if ($LASTEXITCODE -ne 0) { throw 'Packaged revision batch regression failed.' }
      - name: Reviewed revision batch evidence (x64)
        if: always() && matrix.arch == 'x64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: revision-batch-evidence
          path: target/revision-batch-evidence/
          if-no-files-found: ignore
      - name: Packaged rotated rectangle independent geometry checks (x64)
        if: matrix.arch == 'x64'
        run: |
          $version = (Select-String -LiteralPath Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $cli = Join-Path (Get-Location) "dist/SuniPDF-$version-win-x64-portable/sunipdf-cli.exe"
          $qpdf = Join-Path (Get-Location) 'target/qpdf-12.4.2-msvc64/qpdf-12.4.2-msvc64/bin/qpdf.exe'
          python .\scripts\test-rotated-rectangles.py --cli $cli --qpdf $qpdf --directory target\rotated-rectangle-evidence
          if ($LASTEXITCODE -ne 0) { throw 'Packaged rotated rectangle geometry regression failed.' }
      - name: Rotated rectangle evidence (x64)
        if: always() && matrix.arch == 'x64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rotated-rectangle-evidence
          path: target/rotated-rectangle-evidence/
          if-no-files-found: ignore
      - name: Packaged overlay stack independent pixel checks (x64)
        if: matrix.arch == 'x64'
        run: |
          $version = (Select-String -LiteralPath Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $cli = Join-Path (Get-Location) "dist/SuniPDF-$version-win-x64-portable/sunipdf-cli.exe"
          python .\scripts\test-overlay-stack.py --cli $cli --directory target\overlay-stack-evidence --expected-version $version
          if ($LASTEXITCODE -ne 0) { throw 'Packaged overlay stack pixel regression failed.' }
      - name: Overlay stack evidence (x64)
        if: always() && matrix.arch == 'x64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: overlay-stack-evidence
          path: target/overlay-stack-evidence/
          if-no-files-found: ignore
      - name: Release native-library loading boundary (x64)
        if: matrix.arch == 'x64'
        run: .\scripts\test-release-native-loading.ps1
      - name: Test-only software OpenGL checksum self-test (x64)
        if: matrix.arch == 'x64'
        run: .\scripts\fetch-test-opengl.ps1 -SelfTest
      - name: Test-only software OpenGL for the isolated application (x64)
        if: matrix.arch == 'x64'
        run: .\scripts\fetch-test-opengl.ps1
      - name: Real isolated portable upgrades, rollback and close cancellation (x64)
        if: matrix.arch == 'x64'
        run: .\scripts\test-portable-update.ps1 -Package (Get-ChildItem dist\*-win-x64-portable.zip | Select-Object -First 1 -ExpandProperty FullName)
      - name: Portable update regression evidence (x64)
        if: always() && matrix.arch == 'x64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: portable-update-evidence
          path: target/portable-update-*.json
          if-no-files-found: ignore
      - name: MSI (x64 only)
        if: matrix.arch == 'x64'
        run: .\scripts\package-msi.ps1 -Arch x64
      - name: Real MSI installation and upgrade on disposable runner (x64)
        if: matrix.arch == 'x64'
        run: |
          $msi = Get-ChildItem dist\*.msi | Select-Object -First 1 -ExpandProperty FullName
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.8.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.9.1
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.10.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.11.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.12.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.13.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.14.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.15.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.16.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.17.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.18.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.19.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.20.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.21.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.21.1
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.30.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.30.1
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.31.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.32.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.33.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.34.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.35.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.36.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.37.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.38.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.39.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.40.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.41.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.42.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.43.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.44.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.45.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.46.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.47.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.48.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.49.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.50.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.51.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.60.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.61.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.62.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.63.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.64.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.67.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.69.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.70.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.71.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.72.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.73.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.74.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.75.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.76.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.77.0
          .\scripts\test-msi-upgrade.ps1 -MsiPath $msi -BaselineVersion 0.78.0
      - name: MSI upgrade regression evidence (x64)
        if: always() && matrix.arch == 'x64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-msi-upgrade-evidence
          path: target/msi-upgrade-*/*.log
          if-no-files-found: ignore
      - name: Code signing (when a certificate is configured)
        if: matrix.arch == 'x64' && env.SIGN_PFX_BASE64 != ''
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("sign.pfx", [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object { $_.FullName -match "x64" } | Select-Object -First 1 -ExpandProperty FullName
          $msi = (Get-ChildItem dist\*.msi).FullName
          & $signtool sign /f sign.pfx /p $env:SIGN_PFX_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 $msi
          if ($LASTEXITCODE -ne 0) { Remove-Item -LiteralPath sign.pfx -Force; throw 'MSI signing failed.' }
          Remove-Item sign.pfx
          # La signature modifie le fichier : recalculer l'empreinte publiée.
          $hash = (Get-FileHash $msi -Algorithm SHA256).Hash
          Set-Content -Path "$msi.sha256" -Value "$hash  $(Split-Path -Leaf $msi)" -Encoding ascii
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sunipdf-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*.msi
  publish:
    needs: [build, linux, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts
          pattern: sunipdf-*
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: artifacts/**/*
          draft: true
          generate_release_notes: false
          body: |
            Windows x64 packages (portable ZIP and MSI) tested in CI. The ARM64 ZIP is built in CI but
            has not been run on ARM64 hardware. SHA256 checksums are included (.sha256).
            The Ubuntu amd64 DEB is built on Ubuntu 22.04 and checked on Ubuntu 22.04 and 24.04.
            The macOS Apple silicon DMG is built and checked on macOS 15. It is ad hoc signed, not notarized:
            on first launch, allow it in System Settings > Privacy & Security > Open Anyway.
