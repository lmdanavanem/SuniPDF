[package]
name = "sunipdf-desktop"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "SuniPDF desktop application for Windows and Ubuntu Linux."

[[bin]]
name = "sunipdf"
path = "src/main.rs"

[dependencies]
sunipdf-core = { workspace = true }
sunipdf-i18n = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
rfd = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
image = { workspace = true }
chrono = { workspace = true }
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
sha2 = "0.11"
semver = "1"
tempfile = "3"
zeroize = "1"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { workspace = true, features = ["x11", "wayland", "clipboard"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Controls_Dialogs", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Memory", "Win32_System_Com", "Win32_UI_WindowsAndMessaging", "Win32_Storage_Xps", "Win32_Security_Cryptography", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_LibraryLoader"] }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
lopdf = { workspace = true }
pollster = "=1.0.1"
